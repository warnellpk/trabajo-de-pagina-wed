<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Voz RD - Reporte</title>
    <!-- Usamos Poppins para que los títulos se vean sólidos y modernos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --azul-rd: #003087;
            --rojo-rd: #CE1126;
            --blanco: #ffffff;
            --gris-bg: #EAEFF5;
            --gris-texto: #444;
            --borde: #CFD8DC;
            --verde-accion: #00A650;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--gris-bg);
            color: #333;
            /* Tamaño de fuente base masivo */
            font-size: 20px;
        }

        /* HEADER */
        .header-top {
            background: var(--blanco);
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid var(--azul-rd);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .brand h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--azul-rd);
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .brand span { color: var(--rojo-rd); }

        .btn-regresar {
            font-size: 1.4rem;
            text-decoration: none;
            color: #555;
            padding: 1rem 2rem;
            border: 2px solid #ccc;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-regresar:hover {
            background: #333;
            color: white;
            border-color: #333;
        }

        /* CONTENEDOR MASIVO */
        .container-xl {
            /* Ancho enorme para monitores grandes */
            max-width: 1600px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .intro-text {
            text-align: center;
            margin-bottom: 3rem;
        }
        .intro-text h2 { font-size: 4rem; font-weight: 800; color: #222; margin-bottom: 10px; }
        .intro-text p { font-size: 1.8rem; color: #666; }

        /* TARJETA FORMULARIO */
        .giant-card {
            background: var(--blanco);
            padding: 5rem; /* Padding interno exagerado */
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,48,135,0.15);
        }

        /* GRILLA */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 5rem; /* Espacio gigante entre columnas */
            row-gap: 3.5rem;  /* Espacio gigante entre filas */
        }

        .full-span { grid-column: span 2; }

        /* INPUTS Y LABELS XXL */
        label {
            display: block;
            font-size: 1.6rem; /* Label enorme */
            font-weight: 700;
            color: var(--azul-rd);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            height: 90px; /* Input muy alto */
            font-size: 1.8rem; /* Letra interna enorme */
            padding: 0 2rem;
            border-radius: 20px;
            border: 3px solid #ccc; /* Borde grueso */
            background: #F8F9FA;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
            color: #222;
        }

        textarea {
            width: 100%;
            min-height: 250px; /* Área de texto alta */
            font-size: 1.8rem;
            padding: 2rem;
            border-radius: 20px;
            border: 3px solid #ccc;
            background: #F8F9FA;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
        }

        /* Efectos Focus */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--azul-rd);
            background: #fff;
            box-shadow: 0 0 0 8px rgba(0,48,135,0.15); /* Sombra de foco muy visible */
        }

        /* ZONA FOTO GIGANTE */
        .foto-zone {
            width: 100%;
            background: #eef2ff;
            border: 5px dashed var(--azul-rd);
            border-radius: 25px;
            text-align: center;
            padding: 4rem 2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .foto-zone:hover { background: #dce5ff; }

        .foto-icon { font-size: 5rem; color: var(--azul-rd); margin-bottom: 1rem; display: block; }
        .foto-text { font-size: 2.2rem; font-weight: 800; color: var(--azul-rd); display: block;}
        .foto-sub { font-size: 1.4rem; color: #666; font-weight: 500;}

        .check-ok {
            display: none;
            background: var(--verde-accion);
            color: white;
            font-size: 1.5rem;
            padding: 10px 20px;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }

        /* BOTÓN ENVIAR XXL */
        .btn-enviar-huge {
            background: linear-gradient(to right, var(--azul-rd), #004BC4);
            color: white;
            width: 100%;
            padding: 2.5rem;
            font-size: 2.5rem; /* Fuente enorme en botón */
            font-weight: 900;
            border: none;
            border-radius: 80px;
            cursor: pointer;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(0,48,135,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn-enviar-huge:hover {
            transform: scale(1.02); /* Efecto crecer leve */
            box-shadow: 0 15px 40px rgba(0,48,135,0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .container-xl { padding: 0 1rem; width: 100%; }
            .giant-card { padding: 2rem; }
            .intro-text h2 { font-size: 3rem; }
            select, input { height: 70px; font-size: 1.4rem; }
        }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; row-gap: 2rem; }
            .header-top { padding: 1rem; flex-direction: column; gap: 1rem; }
            .btn-enviar-huge { font-size: 1.8rem; padding: 1.5rem; }
            label { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header class="header-top">
        <div class="brand">
            <h1>Mi Voz <span>RD</span></h1>
        </div>
        <a href="indexx.html" class="btn-regresar">
            <i class="fas fa-arrow-left"></i> MENÚ PRINCIPAL
        </a>
    </header>

    <div class="container-xl">
        
        <div class="intro-text">
            <h2>Crear Nuevo Reporte</h2>
            <p>Hazno saber cual es tu problema</p>
        </div>

        <div class="giant-card">
            <form action="https://formsubmit.co/tu-correo-aqui@gmail.com" method="POST" enctype="multipart/form-data">
                
                <div class="grid-layout">
                    
                    <!-- Fila 1 -->
                    <div class="full-span">
                        <label>¿QUÉ TIPO DE PROBLEMA ES?</label>
                        <select name="categoria" required>
                            <option value="">▼ Toca aquí para seleccionar una opción...</option>
                            <option>🚧 BACHES EN LA CALLE</option>
                            <option>💡 FALTA DE LUZ / APAGONES</option>
                            <option>🗑️ MONTONES DE BASURA</option>
                            <option>💧 FUGAS DE AGUA</option>
                            <option>👮 INSEGURIDAD / DELINCUENCIA</option>
                            <option>🌳 ÁRBOLES CAÍDOS / PARQUES</option>
                            <option>📢 OTRO MOTIVO</option>
                        </select>
                    </div>

                    <!-- Fila 2 -->
                    <div class="full-span">
                        <label>¿DÓNDE ES LA UBICACIÓN EXACTA?</label>
                        <input type="text" name="ubicacion" placeholder="Ej: Esquina de Calle Sol con Av. Independencia..." required>
                    </div>

                    <!-- Fila 3 -->
                    <div class="full-span">
                        <label>EXPLICA EL DETALLE DEL PROBLEMA</label>
                        <textarea name="descripcion" placeholder="Escribe aquí los detalles de lo que está sucediendo..."></textarea>
                    </div>

                    <!-- Fila 4: Foto (Ocupa todo el ancho para destacar) -->
                    <div class="full-span">
                        <label>FOTO DE EVIDENCIA</label>
                        <label class="foto-zone">
                            <input type="file" id="fotoInput" name="foto" accept="image/*" capture="environment" style="display:none;" required onchange="fotoCargada()">
                            <i class="fas fa-camera foto-icon"></i>
                            <span class="foto-text">CLIC AQUÍ PARA SUBIR FOTO</span>
                            <span class="foto-sub">Selecciona la imagen desde tu computadora o celular</span>
                            <div id="checkMsg" class="check-ok">
                                <i class="fas fa-check-circle"></i> FOTO SELECCIONADA CON ÉXITO
                            </div>
                        </label>
                    </div>

                    <!-- Fila 5: Datos Personales (Grid dividido en 2) -->
                    <div>
                        <label>CÉDULA (OPCIONAL)</label>
                        <input type="text" name="cedula" placeholder="000-0000000-0">
                    </div>

                    <div>
                        <label>TELÉFONO DE CONTACTO</label>
                        <input type="tel" name="telefono" placeholder="(809) ..." required>
                    </div>

                    <!-- Configuración interna -->
                    <input type="hidden" name="_next" value="gracias.html">
                    <input type="hidden" name="_subject" value="REPORTE PRIORIDAD - Mi Voz RD">

                    <!-- Fila 6: Botón Final -->
                    <div class="full-span">
                        <button type="submit" class="btn-enviar-huge">
                            ENVIAR REPORTE AHORA <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>

                </div>

            </form>
        </div>
        
        <p style="text-align: center; margin-top: 3rem; color: #888; font-size: 1.2rem;">
            Mi Voz RD © Plataforma Ciudadana Segura
        </p>

    </div>

    <script>
        function fotoCargada() {
            // Cambiar estilos al detectar archivo
            var input = document.getElementById('fotoInput');
            if (input.files && input.files.length > 0) {
                var zona = document.querySelector('.foto-zone');
                var checkMsg = document.getElementById('checkMsg');
                var icono = document.querySelector('.foto-icon');
                
                // Color de éxito
                zona.style.borderColor = '#00A650';
                zona.style.background = '#eafff3';
                
                icono.classList.remove('fa-camera');
                icono.classList.add('fa-check-square');
                icono.style.color = '#00A650';

                // Mostrar mensaje de texto del archivo
                checkMsg.style.display = 'inline-block';
                checkMsg.innerHTML = '<i class="fas fa-file-image"></i> LISTO: ' + input.files[0].name;
            }
        }
    </script>

</body>
</html>
