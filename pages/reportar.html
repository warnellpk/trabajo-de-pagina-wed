<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Voz RD - Reportar</title>
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- CSS de Leaflet (para estilos del mapa si se reactivara) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tu hoja de estilos separada -->
    <link rel="stylesheet" href="/style/reportar.css">
</head>
<body>

    <header class="header-top">
        <div class="brand"><h1>Mi Voz <span>RD</span></h1></div>
        <div class="header-actions">
            <button class="btn-nav btn-history"><i class="fas fa-history"></i> <span>Mis Reportes</span></button>
            <a href="/index.html" class="btn-nav btn-back"><i class="fas fa-sign-out-alt"></i> <span>Salir</span></a>
        </div>
    </header>

    <div class="container-xl">

        <!-- ===== VISTA: CREAR (Activa por defecto) ===== -->
        <div id="viewCreate" class="view-section active">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="color: var(--azul-rd); font-weight: 800;">Crear Nuevo Reporte</h2>
                <p>Selecciona una categoría</p>
            </div>

            <!-- GRID ICONOS SUPERIOR -->
            <div class="grid-cats">
                <div class="cat-mini"><i class="fas fa-trash-alt"></i><span>Basura</span></div>
                <div class="cat-mini"><i class="fas fa-road"></i><span>Calles</span></div>
                <div class="cat-mini"><i class="fas fa-bolt"></i><span>Luz</span></div>
                <div class="cat-mini"><i class="fas fa-shield-alt"></i><span>Inseguridad</span></div>
                <div class="cat-mini"><i class="fas fa-volume-up"></i><span>Ruido</span></div>
                <div class="cat-mini"><i class="fas fa-faucet"></i><span>Agua</span></div>
                <div class="cat-mini"><i class="fas fa-lightbulb"></i><span>Alumbrado</span></div>
            </div>

            <div class="report-card">
                <form id="formReporte">
                    <input type="hidden" id="reportId">
                    <div class="form-grid">
                        
                        <!-- SELECTORES DOBLES: CATEGORÍA Y TIPO -->
                        <div class="category-grid">
                            <div>
                                <label>1. CATEGORÍA PRINCIPAL</label>
                                <select id="catSelect" class="select-lg" required>
                                    <option value="">Seleccione...</option>
                                    <option value="Basura">🗑️ Basura / Aseo</option>
                                    <option value="Calles">🚧 Calles y Asfalto</option>
                                    <option value="Luz">⚡ Luz y Apagones</option>
                                    <option value="Seguridad">👮 Seguridad / Crimen</option>
                                    <option value="Ruido">🔊 Ruido / Contaminación</option>
                                    <option value="Agua">💧 Agua Potable / Drenaje</option>
                                    <option value="Alumbrado">💡 Alumbrado Público</option>
                                </select>
                            </div>
                            <div>
                                <label>2. TIPO ESPECÍFICO DE DENUNCIA</label>
                                <select id="typeSelect" class="select-lg" required disabled>
                                    <option value="">← Elija una categoría primero</option>
                                </select>
                            </div>
                        </div>

                        <!-- MAPA CON BOTÓN GPS -->
                        <div>
                            <label><i class="fas fa-map-marked-alt"></i> UBICACIÓN EXACTA</label>
                            
                            <div class="map-relative">
                                <div id="mapaContainer"></div>
                                <!-- BOTÓN GPS -->
                                <button type="button" class="btn-gps" title="Usar mi ubicación actual">
                                    <i class="fas fa-crosshairs"></i>
                                </button>
                            </div>

                            <p class="map-hint" id="mapStatus">ℹ️ Haz clic en el mapa o usa el botón GPS (🎯). Solo RD.</p>
                            <input type="hidden" id="coordLat"><input type="hidden" id="coordLng">
                        </div>

                        <!-- CAMPOS AUTOMATIZADOS -->
                        <div class="auto-grid">
                            <div>
                                <label><i class="fas fa-globe-americas"></i> REGIÓN (AUTO)</label>
                                <input type="text" id="regionRef" class="input-lg" placeholder="Esperando mapa..." readonly>
                            </div>
                            <div>
                                <label><i class="fas fa-city"></i> PROVINCIA / SECTOR</label>
                                <input type="text" id="sectorRef" class="input-lg" placeholder="Esperando mapa..." required>
                            </div>
                        </div>

                        <div>
                            <label>REFERENCIA ADICIONAL</label>
                            <input type="text" id="dirRef" class="input-lg" placeholder="Ej: Frente a la escuela, casa azul..." required>
                        </div>

                        <div>
                            <label>DETALLES ADICIONALES</label>
                            <textarea id="descRef" class="textarea-lg" placeholder="Describe los hechos..."></textarea>
                        </div>

                        <button type="submit" class="btn-enviar" id="btnSubmit">ENVIAR DENUNCIA</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- HISTORIAL () -->
        <div id="viewHistory" class="view-section">
            <h2 style="text-align: center; margin-bottom:20px; color:var(--azul-rd);">Mis Reportes</h2>
            <button style="background:none; border:none; cursor:pointer; color:var(--azul-claro);">⬅ Volver</button>
            <div class="history-card" id="historyList"><p style="text-align:center;">Cargando...</p></div>
        </div>

        <!-- EXITO () -->
        <div id="viewSuccess" class="view-section" style="text-align:center; padding:4rem;">
            <i class="fas fa-check-circle" style="font-size:5rem; color:var(--verde-accion);"></i>
            <h2 style="color:var(--azul-rd);">¡Enviado!</h2>
            <p>Gracias por contribuir a tu comunidad.</p>
            <button class="btn-enviar" style="max-width:300px; margin:20px auto; background:var(--azul-rd);">Nuevo Reporte</button>
            <br>
            <button style="background:none; border:none; text-decoration:underline; cursor:pointer;">Ver Historial</button>
        </div>

    </div>
</body>
</html>
